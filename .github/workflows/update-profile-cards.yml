name: Update profile cards

on:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/update-profile-cards.yml"
      - "scripts/generate_profile_cards.py"
  schedule:
    - cron: "23 */12 * * *"
  workflow_dispatch:

concurrency:
  group: update-profile-cards
  cancel-in-progress: true

jobs:
  build:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    permissions:
      contents: write

    steps:
      - uses: actions/checkout@v4

      - name: Generate profile cards
        id: cards
        continue-on-error: true
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        run: |
          python3 scripts/generate_profile_cards.py \
            --username "${{ github.repository_owner }}" \
            --output-dir "$RUNNER_TEMP/profile-cards"

      - name: Validate and install generated cards
        if: steps.cards.outcome == 'success'
        run: |
          set -euo pipefail
          mkdir -p profile

          for card in stats.svg top-langs.svg activity.svg; do
            test -s "$RUNNER_TEMP/profile-cards/$card"
            grep -q '<svg' "$RUNNER_TEMP/profile-cards/$card"
            install -m 0644 "$RUNNER_TEMP/profile-cards/$card" "profile/$card"
          done

      - name: Keep last good cards after a transient API failure
        if: steps.cards.outcome == 'failure'
        run: |
          echo "::warning::Profile card refresh failed; keeping the previously committed SVGs."

      - name: Commit refreshed cards
        if: steps.cards.outcome == 'success'
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add profile/stats.svg profile/top-langs.svg profile/activity.svg
          git diff --cached --quiet && exit 0
          git commit -m "chore: refresh profile cards"
          git push
