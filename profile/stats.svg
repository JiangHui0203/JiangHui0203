<svg xmlns="http://www.w3.org/2000/svg" width="640" height="120" viewBox="0 0 640 120" role="img" aria-label="GitHub snapshot">
  <style>
    .bg { fill: #fbfaf4; stroke: #d9dfc9; }
    .title { fill: #294532; font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #6f765e; font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .value { fill: #36523e; font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .small { fill: #59644e; font: 500 11px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .track { fill: #e7eadc; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #15231a; stroke: #405640; }
      .title, .value { fill: #eef2df; }
      .label, .small { fill: #c1caaa; }
      .track { fill: #314434; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="638" height="118" rx="14"/>
  <text x="28" y="34" class="title">GitHub snapshot</text>
  <text x="42" y="75" class="value">3</text>
  <text x="42" y="96" class="label">Public repos</text>
  <text x="162" y="75" class="value">0</text>
  <text x="162" y="96" class="label">Stars</text>
  <text x="282" y="75" class="value">0</text>
  <text x="282" y="96" class="label">Followers</text>
  <text x="402" y="75" class="value">20</text>
  <text x="402" y="96" class="label">Contributions</text>
  <text x="522" y="75" class="value">0</text>
  <text x="522" y="96" class="label">Forks</text>
</svg>
