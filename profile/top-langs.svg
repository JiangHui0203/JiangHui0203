<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="Top languages">
  <style>
    .bg { fill: #fbfaf4; stroke: #d9dfc9; }
    .title { fill: #294532; font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #6f765e; font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .value { fill: #36523e; font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .small { fill: #59644e; font: 500 11px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .track { fill: #e7eadc; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #15231a; stroke: #405640; }
      .title, .value { fill: #eef2df; }
      .label, .small { fill: #c1caaa; }
      .track { fill: #314434; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="558" height="218" rx="14"/>
  <text x="28" y="34" class="title">Top languages</text>
  <text x="28" y="72" class="small">JavaScript</text>
  <rect x="142" y="62" width="330" height="11" rx="5.5" class="track"/>
  <rect x="142" y="62" width="289" height="11" rx="5.5" fill="#3F5F45"/>
  <text x="492" y="72" class="small">87.9%</text>
  <text x="28" y="97" class="small">Python</text>
  <rect x="142" y="87" width="330" height="11" rx="5.5" class="track"/>
  <rect x="142" y="87" width="39" height="11" rx="5.5" fill="#5E7A42"/>
  <text x="492" y="97" class="small">11.9%</text>
  <text x="28" y="122" class="small">Shell</text>
  <rect x="142" y="112" width="330" height="11" rx="5.5" class="track"/>
  <rect x="142" y="112" width="3" height="11" rx="5.5" fill="#718B4A"/>
  <text x="492" y="122" class="small">0.2%</text>
</svg>
