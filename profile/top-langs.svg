<svg xmlns="http://www.w3.org/2000/svg" width="560" height="220" viewBox="0 0 560 220" role="img" aria-label="Top languages">
  <style>
    .bg { fill: #ffffff; stroke: #dbeafe; }
    .title { fill: #0f172a; font: 700 18px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .label { fill: #64748b; font: 500 12px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .value { fill: #0f172a; font: 700 22px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .small { fill: #475569; font: 500 11px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; }
    .track { fill: #e2e8f0; }
    @media (prefers-color-scheme: dark) {
      .bg { fill: #0f172a; stroke: #334155; }
      .title, .value { fill: #f8fafc; }
      .label, .small { fill: #cbd5e1; }
      .track { fill: #334155; }
    }
  </style>
  <rect class="bg" x="1" y="1" width="558" height="218" rx="14"/>
  <text x="28" y="34" class="title">Top languages</text>
  <text x="28" y="72" class="small">JavaScript</text>
  <rect x="142" y="62" width="330" height="11" rx="5.5" class="track"/>
  <rect x="142" y="62" width="289" height="11" rx="5.5" fill="#0ea5e9"/>
  <text x="492" y="72" class="small">87.9%</text>
  <text x="28" y="97" class="small">Python</text>
  <rect x="142" y="87" width="330" height="11" rx="5.5" class="track"/>
  <rect x="142" y="87" width="39" height="11" rx="5.5" fill="#14b8a6"/>
  <text x="492" y="97" class="small">11.9%</text>
  <text x="28" y="122" class="small">Shell</text>
  <rect x="142" y="112" width="330" height="11" rx="5.5" class="track"/>
  <rect x="142" y="112" width="3" height="11" rx="5.5" fill="#8b5cf6"/>
  <text x="492" y="122" class="small">0.2%</text>
</svg>
