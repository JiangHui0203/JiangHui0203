<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Hui Jiang — LLM Reasoning, Test-Time Computation and Evaluation</title>
  <desc id="desc">A research profile banner centered on reasoning, evaluation and test-time computation.</desc>

  <defs>
    <linearGradient id="surface" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#f8fafc"/>
      <stop offset="0.52" stop-color="#eff6ff"/>
      <stop offset="1" stop-color="#ecfeff"/>
    </linearGradient>
    <linearGradient id="accent" x1="0" y1="0" x2="1" y2="1">
      <stop offset="0" stop-color="#2563eb"/>
      <stop offset="1" stop-color="#0891b2"/>
    </linearGradient>
    <radialGradient id="glow" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#38bdf8" stop-opacity=".30"/>
      <stop offset="1" stop-color="#38bdf8" stop-opacity="0"/>
    </radialGradient>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#2563eb" stroke-opacity=".07"/>
    </pattern>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="16" stdDeviation="18" flood-color="#0f172a" flood-opacity=".12"/>
    </filter>
  </defs>

  <style>
    .name { font: 800 44px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #0f172a; }
    .tagline { font: 550 18px Inter, ui-sans-serif, system-ui, -apple-system, "Segoe UI", sans-serif; fill: #475569; }
    .mono { font: 500 15px "SFMono-Regular", Consolas, "Liberation Mono", monospace; fill: #334155; }
    .prompt { fill: #2563eb; font-weight: 800; }
    .chip { font: 800 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #1d4ed8; letter-spacing: .75px; }
    .node { font: 800 12px Inter, ui-sans-serif, system-ui, sans-serif; fill: #0e7490; letter-spacing: .55px; }
    .core { font: 850 25px Inter, ui-sans-serif, system-ui, sans-serif; fill: #fff; text-anchor: middle; }
    @media (prefers-color-scheme: dark) {
      .name { fill: #f8fafc; }
      .tagline { fill: #cbd5e1; }
      .mono { fill: #dbeafe; }
      .prompt { fill: #60a5fa; }
      .chip { fill: #7dd3fc; }
      .node { fill: #67e8f9; }
      #background { fill: #07111f; }
      #terminal { fill: #0f172a; stroke: #334155; }
      #terminal-bar { fill: #111827; }
      #grid-layer { opacity: .28; }
    }
  </style>

  <rect id="background" width="1200" height="360" rx="28" fill="url(#surface)"/>
  <rect id="grid-layer" width="1200" height="360" rx="28" fill="url(#grid)"/>
  <circle cx="979" cy="181" r="220" fill="url(#glow)"/>

  <g filter="url(#shadow)">
    <rect id="terminal" x="52" y="42" width="730" height="276" rx="18" fill="#ffffff" stroke="#cbd5e1"/>
    <path id="terminal-bar" d="M70 42h694a18 18 0 0 1 18 18v28H52V60a18 18 0 0 1 18-18Z" fill="#f1f5f9"/>
    <circle cx="80" cy="65" r="6" fill="#fb7185"/>
    <circle cx="101" cy="65" r="6" fill="#fbbf24"/>
    <circle cx="122" cy="65" r="6" fill="#34d399"/>
    <text x="417" y="70" text-anchor="middle" class="chip">JIANGHUI0203://REASONING-LAB</text>

    <text x="86" y="126" class="mono prompt">$ whoami</text>
    <text x="86" y="181" class="name">Hui Jiang</text>
    <text x="86" y="219" class="tagline">LLM Reasoning · Test-Time Computation · Evaluation</text>
    <text x="86" y="267" class="mono">
      <tspan class="prompt">→</tspan>
      <tspan> when to think · where to think · when to stop</tspan>
    </text>
  </g>

  <g>
    <circle cx="982" cy="181" r="118" fill="none" stroke="#2563eb" stroke-opacity=".20" stroke-width="2" stroke-dasharray="8 9"/>
    <circle cx="982" cy="181" r="80" fill="none" stroke="#0891b2" stroke-opacity=".32" stroke-width="2"/>
    <circle cx="982" cy="181" r="52" fill="url(#accent)" filter="url(#shadow)"/>
    <text x="982" y="190" class="core">LLM</text>

    <circle cx="982" cy="63" r="12" fill="#2563eb"/>
    <circle cx="1092" cy="221" r="12" fill="#0891b2"/>
    <circle cx="888" cy="251" r="12" fill="#0ea5e9"/>

    <path d="M982 75v54M1080 217l-52-19M898 243l46-32" stroke="#1d4ed8" stroke-opacity=".42" stroke-width="2"/>

    <rect x="935" y="22" width="94" height="28" rx="14" fill="#dbeafe"/>
    <text x="982" y="41" text-anchor="middle" class="node">THINK</text>

    <rect x="1054" y="242" width="116" height="28" rx="14" fill="#cffafe"/>
    <text x="1112" y="261" text-anchor="middle" class="node">EVALUATE</text>

    <rect x="815" y="267" width="128" height="28" rx="14" fill="#e0f2fe"/>
    <text x="879" y="286" text-anchor="middle" class="node">ALLOCATE</text>
  </g>
</svg>
